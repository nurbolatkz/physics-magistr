<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">

<title>М090 Физика · Механика тесті</title>
<style>
:root {color-scheme:light; --ink:#18233a; --sub:#48556c; --line:#d9e1eb; --blue:#234f9e; --wash:#f2f5fa; --good:#136342; --bad:#983c33; font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--wash);color:var(--ink);line-height:1.55}
main{max-width:900px;margin:auto;padding:26px 18px 36px}
h1,h2,p{margin:0} h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.2}
h2{font-size:1.15rem}.meta,.hint,.source{color:var(--sub);font-size:.9rem}.meta{margin-top:5px}
.toolbar,.jump,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{margin:18px 0 12px}.jump{margin-left:auto}.jump input{width:73px}
button,input{font:inherit}button,.jump input{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:#fff;color:var(--ink)}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #5280d2;outline-offset:2px}
.primary,[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:white}
progress{width:100%;height:7px;display:block;accent-color:var(--blue)}
article{padding:clamp(14px,4vw,30px);margin:14px 0;background:white;border:1px solid var(--line);border-radius:13px}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:13px}
.question{margin:6px 0 14px}
img{display:block;max-width:100%;height:auto}
fieldset{border:0;margin:0;padding:0;min-width:0}legend{padding:0;margin:0 0 8px}
.option{display:grid;grid-template-columns:auto 1.55em minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.option input{margin:.46em 0 0;accent-color:var(--blue)}.letter{font-weight:650;color:var(--sub)}
.option img{margin-top:2px;mix-blend-mode:multiply}
.option:has(input:checked){border-color:var(--blue);background:#f0f5ff}
.option.correct{background:#eaf6ef;border-color:#78a991}.option.wrong{background:#fff1ef;border-color:#d49a92}
.actions{margin-top:13px}
.review{background:#f5f8fc;border:1px solid var(--line);border-radius:9px;margin-top:17px;padding:14px}
.review p{margin-top:7px;overflow-wrap:anywhere}
.good{color:var(--good)}.bad{color:var(--bad)}
.practice{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
details{margin-top:6px}summary{width:fit-content;color:var(--blue);cursor:pointer;font-weight:600}
.nav{justify-content:space-between}.score{margin-top:8px}
@media(max-width:510px){main{padding:17px 10px}.jump{margin-left:0;width:100%}.cardhead{flex-wrap:wrap}}
</style>
</head>

<script>
const bank = JSON.parse(document.getElementById('bank').textContent);
const card = document.getElementById('card');
const number = document.getElementById('number');
const levelButtons = [...document.querySelectorAll('[data-level]')];
const selections = new Map();
const checked = new Map();
let current = 0;
let revealed = false;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function sourceImage(data, fallback) {
  const image = element('img');
  image.src = data.s;
  image.decoding = 'async';
  image.alt = data.t || fallback;
  image.style.width = data.w + 'px';
  return image;
}

function go(index) {
  current = index;
  revealed = false;
  render();
}

function updateScore() {
  const start = Math.floor(current / 100) * 100;
  const results = [...checked].filter(([i]) => i >= start && i < start + 100);
  const scored = results.filter(([, result]) => result !== null);
  const correct = scored.filter(([, result]) => result).length;
  document.getElementById('progress').value = results.length;
  document.getElementById('score').textContent =
    'Тексерілгені ' + results.length + ' / 100 · Дұрысы ' + correct + ' / ' + scored.length;
}

function render() {
  const item = bank[current];
  const level = Math.floor(current / 100);
  const n = current % 100 + 1;
  number.value = n;
  levelButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === level)));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === bank.length - 1;
  updateScore();

  const header = element('div', '', 'cardhead');
  header.append(element('h2', level + 1 + '-деңгей · ' + n + '-сұрақ'),
                element('span', 'PDF · ' + item.p + '-бет', 'source'));
  const question = element('div', '', 'question');
  question.append(sourceImage(item.q, 'Сұрақтың түпнұсқадағы формуласы'));

  const choices = element('fieldset');
  choices.append(element('legend', item.k.length > 1 ? 'Дұрыс нұсқалардың барлығын белгіле.' : 'Бір жауап таңда.', 'hint'));
  const saved = selections.get(current) || [];
  const locked = checked.has(current);
  const showReview = locked || revealed;
  const fields = [];
  item.a.forEach((answer, i) => {
    const label = element('label', '', 'option');
    const field = element('input');
    field.type = item.k.length > 1 ? 'checkbox' : 'radio';
    field.name = 'answer';
    field.checked = saved.includes(i);
    field.disabled = locked;
    field.setAttribute('aria-label', String.fromCharCode(65 + i) + ' · ' + (answer.t || 'Формула'));
    fields.push(field);
    if (showReview && item.k.includes(i)) label.classList.add('correct');
    if (locked && saved.includes(i) && !item.k.includes(i)) label.classList.add('wrong');
    label.append(field, element('span', String.fromCharCode(65 + i), 'letter'), sourceImage(answer, 'Формула'));
    choices.append(label);
  });

  const actions = element('div', '', 'actions');
  const check = element('button', 'Тексеру', 'primary');
  check.type = 'button';
  check.disabled = locked || saved.length === 0;
  fields.forEach(field => field.addEventListener('change', () => {
    const selected = fields.flatMap((input, i) => input.checked ? [i] : []);
    selections.set(current, selected);
    check.disabled = selected.length === 0;
  }));
  check.addEventListener('click', () => {
    const selected = selections.get(current) || [];
    if (selected.length === 0 || checked.has(current)) return;
    checked.set(current, item.flag ? null :
      selected.length === item.k.length && item.k.every(i => selected.includes(i)));
    render();
    document.getElementById('review').focus();
  });
  const show = element('button', 'Жауап пен түсіндірмені көрсету');
  show.type = 'button';
  show.hidden = showReview;
  show.addEventListener('click', () => {
    revealed = true;
    render();
    document.getElementById('review').focus();
  });
  actions.append(check, show);

  card.replaceChildren(header, question, choices, actions);
  if (showReview) {
    const review = element('section', '', 'review');
    review.id = 'review';
    review.tabIndex = -1;
    const letters = item.k.map(i => String.fromCharCode(65 + i)).join(', ');
    const label = item.flag ? 'PDF кілтінде: ' : 'Дұрыс жауап: ';
    const correct = checked.get(current);
    const result = item.flag ? 'Шартты немесе жауап кілтін түсіндірмемен салыстыр. Бұл сұрақ ұпайға кірмейді.' :
      correct === true ? 'Дұрыс таңдадың.' : correct === false ? 'Таңдауың жауап кілтіне сәйкес келмеді.' : '';
    review.append(element('h2', label + letters));
    if (result) review.append(element('p', result, correct === true ? 'good' : correct === false ? 'bad' : 'hint'));
    review.append(element('p', item.explanation));
    const practice = element('section', '', 'practice');
    practice.append(element('h2', 'Ұқсас тапсырма'), element('p', item.practice));
    const details = element('details');
    details.append(element('summary', 'Жауабын ашу'), element('p', item.solution));
    practice.append(details);
    review.append(practice);
    card.append(review);
  }
}

levelButtons.forEach((button, i) => button.addEventListener('click', () => go(i * 100)));
document.getElementById('jump').addEventListener('submit', event => {
  event.preventDefault();
  if (number.validity.valid) go(Math.floor(current / 100) * 100 + number.valueAsNumber - 1);
});
document.getElementById('prev').addEventListener('click', () => go(current - 1));
document.getElementById('next').addEventListener('click', () => go(current + 1));
render();
// preload neighbouring questions so Next/Prev feel instant
function preload(i){const it=bank[i];if(!it)return;[it.q,...it.a].forEach(d=>{const im=new Image();im.src=d.s;});}
const _render=render;render=function(){_render();preload(current+1);preload(current-1);};
preload(1);
</script>
</body>
</html>
